<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'" />
  <title>Provident-Electron</title>
  <style>
    /* Unit U-SHELL-2 §2.1 — the shell appearance token layer (Table C). All
       shell chrome + pane styling reads these custom properties, so a theme
       switch is a single attribute flip on <html>. The base set is light;
       `html[data-theme='dark']` overrides it, and (until the renderer boot
       applies an explicit attribute) the OS preference drives the same dark
       tokens via the media query. Explicit `data-theme` wins over the media
       query by specificity. `--hover` feeds the U-SHELL-6 hover affordance. */
    :root,
    html[data-theme='light'] {
      color-scheme: light;
      --bg: #f4f6f8;
      --fg: #1a1d21;
      --muted: #556;
      --muted-2: #667;
      --muted-3: #445;
      --muted-4: #4a525a;
      --card-bg: #fff;
      --border: #d8dde3;
      --border-strong: #b9c2cc;
      --input-bg: #fff;
      --input-fg: #1a1d21;
      --input-border: #c8cdd3;
      --error: #c0392b;
      --accent: #2f6feb;
      --hover: rgba(15, 23, 42, 0.06);
    }
    html[data-theme='dark'] {
      color-scheme: dark;
      --bg: #1e2226;
      --fg: #e8eaed;
      --muted: #b0b7bf;
      --muted-2: #b0b7bf;
      --muted-3: #c9cfd5;
      --muted-4: #4a525a;
      --card-bg: #262a2e;
      --border: #3a4046;
      --border-strong: #4a525a;
      --input-bg: #1a1d21;
      --input-fg: #e8eaed;
      --input-border: #3a4046;
      --error: #e07b72;
      --accent: #7aa2f7;
      --hover: rgba(255, 255, 255, 0.08);
    }
    /* OS-preference fallback (no explicit `data-theme` yet): `:root` has LOWER
       specificity than `html[data-theme=…]`, so an explicit choice still wins. */
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #1e2226;
        --fg: #e8eaed;
        --muted: #b0b7bf;
        --muted-2: #b0b7bf;
        --muted-3: #c9cfd5;
        --muted-4: #4a525a;
        --card-bg: #262a2e;
        --border: #3a4046;
        --border-strong: #4a525a;
        --input-bg: #1a1d21;
        --input-fg: #e8eaed;
        --input-border: #3a4046;
        --error: #e07b72;
        --accent: #7aa2f7;
        --hover: rgba(255, 255, 255, 0.08);
      }
    }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
    /* LIVE-6/A (window reposition) — the body has NO top padding so the tab
       strip (the outer-chrome drag region) reaches the window's top edge and the
        whole top bar is draggable; content below carries its own padding. */
    header { padding: 0.75rem 1rem; }
    main.layout { padding: 0 1rem 1rem; }
    header h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
    header p { margin: 0 0 1rem; color: var(--muted); font-size: 0.85rem; }
    .layout {
      /* LIVE-6/B (2026-09-14) — the runtime mounts into #app and its zone
         containers are laid out INSIDE #app's wiki-root (below). The shell
         `.layout` is now just a full-width frame that gives #app a definite
         height — the old separate left/stage/right/header/footer shell columns
         are gone (they were the "empty col-resize" dead element). */
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      grid-template-areas: "stage";
      gap: 0;
    }
    .layout #app { grid-area: stage; }
    /* LIVE-6/B — the old shell gutters don't align with the (now in-#app) zone
       columns, so they were the empty col-resize strip. Hide them; C7 resize is
       re-owned by the in-#app gutter wiring. */
    .layout > .gutter { display: none; }
    /* LIVE-6 (2026-09-14) — the runtime mounts into #app, so the app-graph zone
       containers live INSIDE #app's single `wiki-root`. Lay `#wiki-root` out as
       the intended shell grid (header / left · main · right / footer) so the
       panes render as a LEFT SIDEBAR and the stage (`zone:main`) content sits in
       the center — fixing "panes populate the main canvas, not zones". */
    #app > #wiki-root {
      display: grid;
      height: 100%;
      /* F-3 (docs/defects.md EMPTY-ZONE-TRACK-NOT-COLLAPSED) — the per-zone GRID
         TRACK: the persisted size by default, `0px` for an empty zone. These
         declarations are the base the empty-zone rules further below override,
         so they must live on the SAME element those rules target (this one) —
         a rule on the ancestor frame is only INHERITED and would lose to this
         declaration. The grid templates consume the track, never the raw size
         (which was the defect: every collapsed-track variable was declared but
         never read, so an empty zone kept its track and the stage never
         reclaimed the space). */
      --zone-left-track: var(--zone-left-size, 220px);
      --zone-right-track: var(--zone-right-size, 220px);
      --zone-header-track: var(--zone-header-size, 48px);
      --zone-footer-track: var(--zone-footer-size, 48px);
      grid-template-columns: var(--zone-left-track) minmax(0, var(--stage-weight, 1fr)) var(--zone-right-track);
      grid-template-rows: var(--zone-header-track) minmax(0, 1fr) var(--zone-footer-track);
      grid-template-areas:
        "header header header"
        "left   main   right"
        "footer footer footer";
      /* ⟨Unit `U-ZONE-REPLACEMENT` / `PD-UI-14` §2.1(d) — THE ZONES ARE FIXED.⟩
         `contain: layout` makes THIS element the containing block for its
         `position: fixed` descendants, so the four zone containers' fixed boxes
         (below) are positioned in the SAME coordinate space — and against the
         SAME track tokens — as the grid areas they belong to. Without it a fixed
         zone would resolve against the viewport and drift off its own track. */
      contain: layout;
    }
    #app [data-zone="header"] { grid-area: header; }
    #app [data-zone="left"]   { grid-area: left;   }
    #app [id="zone:main"]     { grid-area: main;   }
    #app [data-zone="right"]  { grid-area: right;  }
    #app [data-zone="footer"] { grid-area: footer; }
    #app [id="zone:sidebar"]  { display: none; }
    .layout #panes { grid-area: left; }
    /* W2-N4 (AF-4) — the operator panes are modal-confined (C3) and MUST NOT
       occupy an app pane zone. The former `.layout #operator-panes
       { grid-area: right }` (higher specificity) defeated the spanning rule
       below; operator-pane placement is owned by U-SHELL-3/9. */
    .layout .zone-footer { grid-area: footer; }
    /* Unit U-SHELL-4 (C11, H6) / F-3 — an empty zone's grid track collapses to
       zero, UNLESS the drag controller currently reveals it as a provisional
       drop target (`.is-revealed`). The state-derived `.is-empty` mirror is
       gated by `:not(.is-revealed)`; a non-empty zone (no `.is-empty`) never
       matches, so its persisted size is retained through the base track
       declaration. These rules must target the grid element ITSELF (it declares
       the base track): same element + higher specificity wins the cascade,
       which is what makes the declaration above actually collapse. */
    #app > #wiki-root:has([data-zone='left'].is-empty:not(.is-revealed)) { --zone-left-track: 0px; }
    #app > #wiki-root:has([data-zone='right'].is-empty:not(.is-revealed)) { --zone-right-track: 0px; }
    #app > #wiki-root:has([data-zone='header'].is-empty:not(.is-revealed)) { --zone-header-track: 0px; }
    #app > #wiki-root:has([data-zone='footer'].is-empty:not(.is-revealed)) { --zone-footer-track: 0px; }
    /* ⟨Unit `U-ZONE-REPLACEMENT` / `PD-UI-14` — §2.1(d) ALL ZONES ARE FIXED
       POSITION WITH ANY SCROLLING INTERNAL, and §2.1(f) THE STAGE ALSO SCROLLS
       INTERNALLY.⟩ THE TWO CLAUSES, AND WHAT EACH DECLARATION IS FOR:
       (1) THE PAGE NEVER SCROLLS THE ZONES AWAY: `html`/`body` are viewport-high
           and non-scrollable, and the shell frame below the tab strip is a
           DEFINITE-height flex row — so `#app`'s grid has a definite height
           instead of growing with the mounted document. (The measured defect this
           replaces: with a long document open, `#wiki-root` stretched to 12843px
           and carried every zone's box with it.)
       (2) EACH ZONE CONTAINER IS `position: fixed` WITH ITS OWN BOUNDED BOX: the
           insets are the SAME `--zone-<z>-track` tokens the grid element above
           consumes, so a fixed zone's box stays exactly on its grid area (a
           collapsed/empty zone's `0px` track collapses its fixed box too), and
           `overflow: auto` sits on the zone's own content box — so a zone whose
           content is taller than its box scrolls INSIDE that box.
       (3) `#zone:main` (the STAGE) is its own scroll container: it keeps its
           `main` grid area (the negative space between the zone tracks, §2.1(c))
           and gains `overflow: auto`, so a document longer than the stage's box
           scrolls inside the stage while the surrounding chrome keeps its rects.
       THE SELECTOR IS THE ZONE CONTAINER, NEVER `[data-zone]` ALONE: the four
       authored gutter affordances and the zone minimize controls ALSO carry
       `data-zone` (they are children/controls, not containers), so the zone rule
       is scoped by the container's own `zone:<name>` id.
       THE `G-5` FIFTEEN-TOKEN THEME CENSUS IS UNTOUCHED — no custom property is
       declared or moved inside the three theme blocks and none is declared here
       (the track tokens stay on the grid element above); §3.2's class/attribute
       vocabulary and the two `.layout .gutter[data-axis=…]` cursor rules are
       unchanged. */
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    .tab-strip { flex: none; }
    main.layout { flex: 1 1 auto; min-height: 0; overflow: hidden; }
    .layout #app { min-width: 0; min-height: 0; }
    #app [id^="zone:"][data-zone] { position: fixed; overflow: auto; box-sizing: border-box; }
    #app [id="zone:header"][data-zone] { top: 0; left: 0; right: 0; height: var(--zone-header-track); }
    #app [id="zone:footer"][data-zone] { bottom: 0; left: 0; right: 0; height: var(--zone-footer-track); }
    #app [id="zone:left"][data-zone] { top: var(--zone-header-track); bottom: var(--zone-footer-track); left: 0; width: var(--zone-left-track); }
    #app [id="zone:right"][data-zone] { top: var(--zone-header-track); bottom: var(--zone-footer-track); right: 0; width: var(--zone-right-track); }
    #app [id="zone:main"] { overflow: auto; min-width: 0; min-height: 0; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
    h2 { font-size: 1rem; margin: 0 0 0.75rem; }
    .counter-value { font-size: 2rem; font-weight: 700; margin: 0 0 0.75rem; }
    .btn { margin-right: 0.5rem; }
    /* Unit U-SHELL-6 (C6) — the shared hover affordance: every node authored
       with a click/select handler carries `is-clickable`; the token background
       themes with C1. */
    .is-clickable { cursor: pointer; }
    .is-clickable:hover { background: var(--hover); }
    /* Unit U-SHELL-3 (C5) — a collapsed pane renders its frame header/handle
       only. The pane body nodes are UNMOUNTED from the graph (not CSS-hidden),
       so the collapsed frame is the chrome around the header/toggle control. */
    .pane-frame { border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem; }
    .pane-frame.is-collapsed { padding: 0.25rem 0.5rem; }
    .pane-frame .pane-collapse-toggle { display: block; width: 100%; text-align: left; }
    input { width: 100%; box-sizing: border-box; padding: 0.4rem; background: var(--input-bg); color: var(--input-fg); border: 1px solid var(--input-border); }
    .echo-out { margin-top: 0.75rem; padding: 0.5rem; border: 1px dashed var(--border-strong); min-height: 1.25rem; }
    #status { margin-top: 1rem; font-family: monospace; font-size: 0.75rem; color: var(--muted); }
    #panes { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    #panes .hint { font-size: 0.75rem; color: var(--muted-2); margin: 0 0 0.75rem; }
    #panes #security-status { font-family: monospace; font-size: 0.8rem; margin-bottom: 0.75rem; color: var(--muted-3); }
    #panes #security-token label { display: block; font-size: 0.8rem; margin-bottom: 0.3rem; color: var(--muted-3); }
    #panes .token-row { display: flex; gap: 0.5rem; }
    #panes .token-row input { flex: 1; }
    #panes #group-toggles { border: 1px solid var(--border); border-radius: 8px; margin-top: 0.75rem; padding: 0.5rem 0.75rem; }
    #panes #group-toggles label { display: block; padding: 0.25rem 0; }
    .group-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0; }
    .group-row label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; }
    /* The operator panes (settings) are a SEPARATE graph scope (never
       MCP-visible), so they cannot live inside the app-graph sidebar. Style
       the #operator-panes container as a proper card/pane so the settings
       render as a titled pane instead of a bare element at the bottom. */
    #operator-panes { grid-column: 1 / -1; }
    #operator-panes section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-top: 1rem; }
    #operator-panes h2 { font-size: 1rem; margin: 0 0 0.75rem; }
    #operator-panes div { margin: 0.25rem 0; }
    #operator-panes button { margin-top: 0.5rem; }
    .error { color: var(--error); font-size: 0.8rem; margin-top: 0.5rem; }
    /* Unit U-SHELL-4 (C11) — a zero-pane zone is a provisional drop target only
       while a dragged pane comes near it (`is-revealed`); otherwise its grid
       track collapses (the derived `is-empty`). */
    .is-empty.is-revealed { outline: 2px dashed var(--accent); outline-offset: 2px; min-height: 2rem; }
    /* Unit U-SHELL-4 (C12) — a minimized zone REPLACES its pane stack with a
       tab strip (provident subtree). Sidebars (`left`/`right`) stack their tabs
       vertically; header/footer lay them out horizontally (edge-derived). */
    .is-minimized .pane-tab { cursor: pointer; }
    [data-orientation='vertical'] .pane-tab { display: block; }
    [data-orientation='horizontal'] .pane-tab { display: inline-block; margin-right: 0.5rem; }
    /* Unit U-SHELL-5 (C7) — the resize gutters between the zone tracks. The
       shell pointer controller owns the drag mechanic; the surface only reads
       the C1 tokens so it themes with the rest of the chrome. A column gutter
       (left|stage, stage|right) resizes horizontally; a row gutter
       (header/main, main/footer) vertically. An empty/minimized zone has no
       gutter (the controller's `isGutterResizable` gate) so no rule reveals one. */
    .layout .gutter { flex: none; background: var(--border); }
    .layout .gutter:hover { background: var(--hover); }
    .layout .gutter[data-axis='columns'] { cursor: col-resize; }
    .layout .gutter[data-axis='rows'] { cursor: row-resize; }
    /* ⟨Unit `U-ZONE-REPLACEMENT` / `PD-UI-14` — gate-4 re-audit finding 8: THE FOUR
       AUTHORED AFFORDANCES HAVE NO BOX.⟩ THE AFFORDANCE'S BOX IS THE ZONE'S OWN
       EDGE (`pane-graph.ts`'s own authoring comment), and the four affordances are
       authored by the producing graph INSIDE `#app > #wiki-root` — while every rule
       above is scoped `.layout .gutter`, where they are NOT descendants of
       `.layout`'s direct children (`#app` is), so the old shell rules left them at
       `display: block` with no box: a zero-area element is unpaintable AND
       unhittable by real input (the live pass printed zero affordance geometry), and
       §3.2's second dependent (the two cursor rules) was therefore discharged only by
       the inline declaration + the `pointerdown`-time write.
       THE DECLARATION IS SCOPED TO THE AUTHORED AFFORDANCE AND SITS ON THE ZONE'S OWN
       TRACK EDGE, consuming the SAME `--zone-<z>-track` tokens the grid element and
       the fixed zone containers consume (so a collapsed `0px` track collapses its
       affordance with it). It is OUTSIDE the three THEME blocks and declares NO
       custom property — the `G-5` fifteen-token census is untouched — and the shell's
       class/attribute vocabulary (`class="gutter"` + `data-zone` + `data-axis`) is
       unchanged, so both `.layout .gutter` dependents above and the delegated
       `.gutter[data-zone]` wiring keep matching with NO re-point. */
    #app .gutter[data-zone] { position: fixed; z-index: 3; background: var(--border); touch-action: none; }
    #app .gutter[data-zone]:hover { background: var(--hover); }
    #app .gutter[id='zone-gutter-left']   { left: calc(var(--zone-left-track) - 3px);   top: var(--zone-header-track); bottom: var(--zone-footer-track); width: 6px; }
    #app .gutter[id='zone-gutter-right']  { right: calc(var(--zone-right-track) - 3px); top: var(--zone-header-track); bottom: var(--zone-footer-track); width: 6px; }
    #app .gutter[id='zone-gutter-header'] { top: calc(var(--zone-header-track) - 3px);  left: 0; right: 0; height: 6px; }
    #app .gutter[id='zone-gutter-footer'] { bottom: calc(var(--zone-footer-track) - 3px); left: 0; right: 0; height: 6px; }
    /* Unit U-SHELL-9a §2.4 — the shell top-bar tab strip (shell chrome, not a
       pane zone). It scrolls horizontally on overflow (no overflow dropdown)
       and highlights the single active tab. */
    /* U-DEMO-BRANDING (2026-09-16, user report): the app NAME lives in the
       top-bar row (the tab strip's row, which is also the window drag region)
       as a compact nameplate, and the tagline DESCRIPTION moves to the landing
       page. The former 90px-tall `<header>` block (h1 + subtitle) is GONE so
       the nameplate + description no longer consume the canvas. */
    .tab-strip .app-nameplate { -webkit-app-region: drag; display: inline-flex; align-items: center; flex: none; margin: 0 0.5rem 0 0.25rem; font-size: 0.9rem; font-weight: 700; letter-spacing: 0.01em; color: var(--fg); white-space: nowrap; }
    .tab-strip { display: flex; align-items: stretch; gap: 0.25rem; overflow-x: auto; overflow-y: hidden; min-width: 0; min-height: var(--top-bar-size, 36px); -webkit-app-region: drag; padding-right: 140px; }
    .tab-strip .tab { -webkit-app-region: no-drag; display: inline-flex; align-items: center; gap: 0.35rem; white-space: nowrap; border: 1px solid var(--border); background: var(--card-bg); color: var(--fg); border-radius: 6px 6px 0 0; padding: 0.25rem 0.5rem; cursor: pointer; }
    .tab-strip .tab.is-active { border-color: var(--accent); background: var(--hover); font-weight: 600; }
    .tab-strip .tab-close { opacity: 0.6; }
    .tab-strip .tab-new { flex: none; -webkit-app-region: no-drag; margin-left: 0.25rem; }
    .tab-strip .tab-close { -webkit-app-region: no-drag; }
    /* Unit U-SHELL-7 (C3) — the settings modal shell chrome. The frame is a
       top-layer overlay carrying exactly one state class (is-open XOR is-closed,
       the §2.3 wiring mirror); the dedicated scrim + body wrap the operator
       mounts. Hidden by default via the `.is-closed` display rule. */
    .settings-modal {
      position: fixed; inset: 0;
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .settings-modal.is-closed { display: none; }
    #settings-modal-scrim {
      position: absolute; inset: 0;
      background: rgba(0, 0, 0, 0.45);
      cursor: pointer;
      /* ADV1 — the parent `.settings-modal` sets `pointer-events: none` (so the
         frame never intercepts); the scrim must RESET to `auto` or its
         scrim-click-to-close is dead (clicks pass through to the page behind). */
      pointer-events: auto;
    }
    #settings-modal-body {
      position: relative;
      z-index: 1;
      background: var(--app-bg, #1b1f24);
      border: 1px solid var(--border, #444);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      max-width: min(880px, 92vw);
      max-height: 88vh;
      overflow: auto;
      padding: 1.25rem;
      pointer-events: auto;
    }
    .settings-toggle {
      position: fixed; left: 1rem; bottom: 0.75rem;
      z-index: 110;
      padding: 0.5rem 0.9rem;
      font-size: 0.8rem;
      border: 1px solid var(--border, #444);
      border-radius: 999px;
      background: var(--card-bg, #252a30);
      color: var(--fg, #eee);
      cursor: pointer;
    }
    .settings-toggle:hover { background: var(--hover, #2e343c); }
  </style>
</head>
<body>
  <!-- Unit U-SHELL-9a live fix (LIVE-2): the main-focus tab strip is the TOP
       bar, ABOVE the layout (not the layout's top-bar grid row below it).
       U-DEMO-BRANDING (2026-09-16, user report): the app NAME is the nameplate
       in this same top-bar row (so the branding costs no extra vertical space),
       and the DESCRIPTION lives on the landing page (`landingContent()`); the
       former `<header>` block (h1 + subtitle, 90px of every page) is removed. -->
  <div id="tab-strip" class="tab-strip"><h1 class="app-nameplate">Astrographer</h1></div>
  <main class="layout">
    <div id="app" class="card"></div>
    <div id="panes"></div>
    <div id="operator-panes"></div>
    <!-- ⟨Unit `U-ZONE-REPLACEMENT` / `PD-UI-14` §3.1(d) — THE FOUR GUTTER AFFORDANCES
         ARE NO LONGER AUTHORED HERE.⟩ They are authored as ENVELOPE/PLACEMENT DATA at
         the producing graph's authoring site (`src/renderer/pane-graph.ts`, one
         affordance per `LAYOUT_PANE_ZONES` member) and driven through the graph, per
         the project-wide UI constraint (§12 item 6: a control node never moves out of
         the provident graph). §3.2 keeps the class/attribute vocabulary the two
         dependents below already target — the authored nodes render as
         `class="gutter" data-zone="<zone>" data-axis="<axis>"`, so NO re-point is
         needed: the delegated `.gutter[data-zone]` pointer wiring in `renderer.ts` and
         the two `.layout .gutter[data-axis=…]` cursor rules below keep matching. -->
  </main>
  <!-- Unit U-SHELL-7 (C3) — the settings modal shell chrome (plain authored
       elements in <body>, OUTSIDE the <main class="layout"> grid; no on:*
       handler; not MCP-visible). The dedicated scrim + body are the modal
       container; installSettingsModal re-parents the EXISTING operator mounts
       (#panes, #operator-panes) into #settings-modal-body. -->
  <div id="settings-modal" class="settings-modal is-closed">
    <div id="settings-modal-scrim"></div>
    <div id="settings-modal-body"></div>
  </div>
  <button id="settings-toggle" class="settings-toggle" type="button">Settings</button>
  <script type="module" src="./renderer.js"></script>
</body>
</html>
