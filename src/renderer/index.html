<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'" />
  <title>Provident-Electron</title>
  <style>
    /* Unit U-SHELL-2 §2.1 — the shell appearance token layer (Table C). All
       shell chrome + pane styling reads these custom properties, so a theme
       switch is a single attribute flip on <html>. The base set is light;
       `html[data-theme='dark']` overrides it, and (until the renderer boot
       applies an explicit attribute) the OS preference drives the same dark
       tokens via the media query. Explicit `data-theme` wins over the media
       query by specificity. `--hover` feeds the U-SHELL-6 hover affordance. */
    :root,
    html[data-theme='light'] {
      color-scheme: light;
      --bg: #f4f6f8;
      --fg: #1a1d21;
      --muted: #556;
      --muted-2: #667;
      --muted-3: #445;
      --muted-4: #4a525a;
      --card-bg: #fff;
      --border: #d8dde3;
      --border-strong: #b9c2cc;
      --input-bg: #fff;
      --input-fg: #1a1d21;
      --input-border: #c8cdd3;
      --error: #c0392b;
      --accent: #2f6feb;
      --hover: rgba(15, 23, 42, 0.06);
    }
    html[data-theme='dark'] {
      color-scheme: dark;
      --bg: #1e2226;
      --fg: #e8eaed;
      --muted: #b0b7bf;
      --muted-2: #b0b7bf;
      --muted-3: #c9cfd5;
      --muted-4: #4a525a;
      --card-bg: #262a2e;
      --border: #3a4046;
      --border-strong: #4a525a;
      --input-bg: #1a1d21;
      --input-fg: #e8eaed;
      --input-border: #3a4046;
      --error: #e07b72;
      --accent: #7aa2f7;
      --hover: rgba(255, 255, 255, 0.08);
    }
    /* OS-preference fallback (no explicit `data-theme` yet): `:root` has LOWER
       specificity than `html[data-theme=…]`, so an explicit choice still wins. */
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #1e2226;
        --fg: #e8eaed;
        --muted: #b0b7bf;
        --muted-2: #b0b7bf;
        --muted-3: #c9cfd5;
        --muted-4: #4a525a;
        --card-bg: #262a2e;
        --border: #3a4046;
        --border-strong: #4a525a;
        --input-bg: #1a1d21;
        --input-fg: #e8eaed;
        --input-border: #3a4046;
        --error: #e07b72;
        --accent: #7aa2f7;
        --hover: rgba(255, 255, 255, 0.08);
      }
    }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: var(--bg); color: var(--fg); }
    header h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
    header p { margin: 0 0 1rem; color: var(--muted); font-size: 0.85rem; }
    .layout {
      /* Unit U-SHELL-1 §2.4 (Table C shell grid) — the shell geometry: a
         top-bar row → a header zone row → the main row (left | stage | right)
         → a footer zone row. The tracks read `ZoneLayout.size`; an empty zone's
         track collapses (derived from `is-empty`). U-SHELL-5 owns the gutters. */
      display: grid;
      /* W2-N3 (AF-3) — the tracks read the persisted `ZoneLayout.size` /
         `stage.size` / `topBar.size` via CSS custom properties (set from the
         layout at boot + on change). The fallbacks pin the §2.1 defaults.
         `stage.size` is the serialized 1fr weight; the rest are px tracks. */
      grid-template-columns: var(--zone-left-track, minmax(160px, var(--zone-left-size, 220px))) minmax(0, var(--stage-weight, 1fr)) var(--zone-right-track, minmax(160px, var(--zone-right-size, 220px)));
      grid-template-rows: var(--top-bar-size, 36px) var(--zone-header-track, var(--zone-header-size, 48px)) minmax(0, 1fr) var(--zone-footer-track, var(--zone-footer-size, 48px));
      grid-template-areas:
        "top-bar top-bar top-bar"
        "header  header  header"
        "left    stage   right"
        "footer  footer  footer";
      gap: 1rem;
    }
    .layout > header,
    .layout .top-bar { grid-area: top-bar; }
    .layout .zone-header { grid-area: header; }
    .layout #app { grid-area: stage; }
    .layout #panes { grid-area: left; }
    /* W2-N4 (AF-4) — the operator panes are modal-confined (C3) and MUST NOT
       occupy an app pane zone. The former `.layout #operator-panes
       { grid-area: right }` (higher specificity) defeated the spanning rule
       below; operator-pane placement is owned by U-SHELL-3/9. */
    .layout .zone-footer { grid-area: footer; }
    /* Unit U-SHELL-4 (C11, H6) — an empty zone's grid track collapses to zero,
       UNLESS the drag controller currently reveals it as a provisional drop
       target (`.is-revealed`). The state-derived `.is-empty` mirror is gated by
       `:not(.is-revealed)`; a non-empty zone (no `.is-empty`) never matches, so
       its persisted `--zone-*-size` track is retained. */
    .layout:has([data-zone='left'].is-empty:not(.is-revealed)) { --zone-left-track: 0px; }
    .layout:has([data-zone='right'].is-empty:not(.is-revealed)) { --zone-right-track: 0px; }
    .layout:has([data-zone='header'].is-empty:not(.is-revealed)) { --zone-header-track: 0px; }
    .layout:has([data-zone='footer'].is-empty:not(.is-revealed)) { --zone-footer-track: 0px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
    h2 { font-size: 1rem; margin: 0 0 0.75rem; }
    .counter-value { font-size: 2rem; font-weight: 700; margin: 0 0 0.75rem; }
    .btn { margin-right: 0.5rem; }
    /* Unit U-SHELL-6 (C6) — the shared hover affordance: every node authored
       with a click/select handler carries `is-clickable`; the token background
       themes with C1. */
    .is-clickable { cursor: pointer; }
    .is-clickable:hover { background: var(--hover); }
    /* Unit U-SHELL-3 (C5) — a collapsed pane renders its frame header/handle
       only. The pane body nodes are UNMOUNTED from the graph (not CSS-hidden),
       so the collapsed frame is the chrome around the header/toggle control. */
    .pane-frame { border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem; }
    .pane-frame.is-collapsed { padding: 0.25rem 0.5rem; }
    .pane-frame .pane-collapse-toggle { display: block; width: 100%; text-align: left; }
    input { width: 100%; box-sizing: border-box; padding: 0.4rem; background: var(--input-bg); color: var(--input-fg); border: 1px solid var(--input-border); }
    .echo-out { margin-top: 0.75rem; padding: 0.5rem; border: 1px dashed var(--border-strong); min-height: 1.25rem; }
    #status { margin-top: 1rem; font-family: monospace; font-size: 0.75rem; color: var(--muted); }
    #panes { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    #panes .hint { font-size: 0.75rem; color: var(--muted-2); margin: 0 0 0.75rem; }
    #panes #security-status { font-family: monospace; font-size: 0.8rem; margin-bottom: 0.75rem; color: var(--muted-3); }
    #panes #security-token label { display: block; font-size: 0.8rem; margin-bottom: 0.3rem; color: var(--muted-3); }
    #panes .token-row { display: flex; gap: 0.5rem; }
    #panes .token-row input { flex: 1; }
    #panes #group-toggles { border: 1px solid var(--border); border-radius: 8px; margin-top: 0.75rem; padding: 0.5rem 0.75rem; }
    #panes #group-toggles label { display: block; padding: 0.25rem 0; }
    .group-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0; }
    .group-row label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; }
    /* The operator panes (settings) are a SEPARATE graph scope (never
       MCP-visible), so they cannot live inside the app-graph sidebar. Style
       the #operator-panes container as a proper card/pane so the settings
       render as a titled pane instead of a bare element at the bottom. */
    #operator-panes { grid-column: 1 / -1; }
    #operator-panes section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-top: 1rem; }
    #operator-panes h2 { font-size: 1rem; margin: 0 0 0.75rem; }
    #operator-panes div { margin: 0.25rem 0; }
    #operator-panes button { margin-top: 0.5rem; }
    .error { color: var(--error); font-size: 0.8rem; margin-top: 0.5rem; }
    /* Unit U-SHELL-4 (C11) — a zero-pane zone is a provisional drop target only
       while a dragged pane comes near it (`is-revealed`); otherwise its grid
       track collapses (the derived `is-empty`). */
    .is-empty.is-revealed { outline: 2px dashed var(--accent); outline-offset: 2px; min-height: 2rem; }
    /* Unit U-SHELL-4 (C12) — a minimized zone REPLACES its pane stack with a
       tab strip (provident subtree). Sidebars (`left`/`right`) stack their tabs
       vertically; header/footer lay them out horizontally (edge-derived). */
    .is-minimized .pane-tab { cursor: pointer; }
    [data-orientation='vertical'] .pane-tab { display: block; }
    [data-orientation='horizontal'] .pane-tab { display: inline-block; margin-right: 0.5rem; }
    /* Unit U-SHELL-5 (C7) — the resize gutters between the zone tracks. The
       shell pointer controller owns the drag mechanic; the surface only reads
       the C1 tokens so it themes with the rest of the chrome. A column gutter
       (left|stage, stage|right) resizes horizontally; a row gutter
       (header/main, main/footer) vertically. An empty/minimized zone has no
       gutter (the controller's `isGutterResizable` gate) so no rule reveals one. */
    .layout .gutter { flex: none; background: var(--border); }
    .layout .gutter:hover { background: var(--hover); }
    .layout .gutter[data-axis='columns'] { cursor: col-resize; }
    .layout .gutter[data-axis='rows'] { cursor: row-resize; }
    /* Unit U-SHELL-9a §2.4 — the shell top-bar tab strip (shell chrome, not a
       pane zone). It scrolls horizontally on overflow (no overflow dropdown)
       and highlights the single active tab. */
    .tab-strip { display: flex; align-items: stretch; gap: 0.25rem; overflow-x: auto; overflow-y: hidden; min-width: 0; }
    .tab-strip .tab { display: inline-flex; align-items: center; gap: 0.35rem; white-space: nowrap; border: 1px solid var(--border); background: var(--card-bg); color: var(--fg); border-radius: 6px 6px 0 0; padding: 0.25rem 0.5rem; cursor: pointer; }
    .tab-strip .tab.is-active { border-color: var(--accent); background: var(--hover); font-weight: 600; }
    .tab-strip .tab-close { opacity: 0.6; }
    .tab-strip .tab-new { flex: none; }
  </style>
</head>
<body>
  <header>
    <h1>Provident-Electron — MCP endpoint demo</h1>
    <p>provident-ssr renderer with synthetic-event access + rendered-HTML visibility for agentic MCP use.</p>
  </header>
  <main class="layout">
    <!-- Unit U-SHELL-9a — the top-bar main-focus tab strip (shell chrome). -->
    <div id="tab-strip" class="top-bar tab-strip"></div>
    <div id="app" class="card"></div>
    <div id="panes"></div>
    <div id="operator-panes"></div>
    <!-- Unit U-SHELL-N7 (HOST-1) — the four shell resize gutters (shell chrome,
         plain authored elements, no on:* handler). Each carries a matching
         `data-axis` so the `.layout .gutter[data-axis=…]` cursor rules apply AND
         the delegated `.gutter[data-zone]` pointer wiring resolves it. -->
    <div class="gutter" data-zone="left" data-axis="columns"></div>
    <div class="gutter" data-zone="right" data-axis="columns"></div>
    <div class="gutter" data-zone="header" data-axis="rows"></div>
    <div class="gutter" data-zone="footer" data-axis="rows"></div>
  </main>
  <script type="module" src="./renderer.js"></script>
</body>
</html>
